name: Refresh profile dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_profile.py"
      - ".github/workflows/profile-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate the dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: rayhanferdiansyah1-alt
        run: python3 scripts/build_profile.py

      - name: Commit only when the dashboard changed
        run: |
          git config user.name "rayhan-profile-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/live-dashboard.svg

          if git diff --cached --quiet; then
            echo "Dashboard is already current."
            exit 0
          fi

          git commit -m "chore(profile): refresh engineering signal"
          git push
